name: Bug report
description: Report something that is broken or behaving unexpectedly in Waybinder.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Waybinder bug. Please include enough detail to reproduce it.
  - type: input
    id: waybinder-version
    attributes:
      label: Waybinder version
      placeholder: "1.2.0+26.3"
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: fabric-version
    attributes:
      label: Fabric Loader / Fabric API versions
      placeholder: "Loader 0.19.5, Fabric API 0.162.0+26.3"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer / integrated server
        - Dedicated server
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /rtp
        2. Run /home
        3. Run /rtpback
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: Drag and drop latest.log or a crash report here, or paste a link.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, relevant config values, other installed mods, or extra context.
